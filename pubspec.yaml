name: ganithamithura
description: "A Flutter project for AR-based learning and measurement."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  http: ^1.2.0
  dio: ^5.4.0
  flutter_dotenv: ^6.0.0
  web_socket_channel: ^3.0.3


  # UI & Animations
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.2.0

  # Media
  video_player: ^2.8.2
  chewie: ^1.7.5

  # Speech & Permissions
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

  # Camera & Images
  camera: ^0.11.2+1
  image_picker: ^1.0.7
  image: ^4.2.0

  # Machine Learning
  tflite_flutter: ^0.12.1

  # AR (ONLY ONE PLUGIN)
  ar_flutter_plugin_updated: ^0.0.1

  # 3D Model Rendering
  model_viewer_plus: ^1.9.3
  flutter_cube: ^0.1.1

  # Drawing / Canvas
  flutter_painter: ^1.0.1

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.2
  uuid: ^4.0.0
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.3.0
  audioplayers: ^6.6.0
  confetti: ^0.8.0
  flutter_unit_ruler: ^1.0.1
  sensors_plus: ^7.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/symbols/logoicon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/Shapes/
    - assets/images/2d_shapes/
    - assets/images/3d_shapes/
    - assets/images/patterns/
    - assets/images/patterns/2d_shapes/
    - assets/images/patterns/3d_shapes/
    - assets/images/volume/
    - assets/images/number/
    - assets/videos/
    - assets/animations/
    - assets/numbers/
    - assets/data/
    - assets/vectors/
    - assets/images/number/
    - assets/images/patterns/3d_shapes/
    - assets/symbols/
    - assets/symbols/game/
    - assets/symbols/sounds/
    - assets/sounds/
    - assets/models/classroom.tflite
    - assets/labels/classes.txt
    - assets/models/cone.glb
    - assets/models/cylinder.glb
    - assets/models/pyramid.glb
    - .env